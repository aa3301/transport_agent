name: CD - Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 51.21.170.168
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            /usr/local/bin/deploy.sh
